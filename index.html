 try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '));}catch(e){}}
function tone(f,d,type='square',v=0.15,f2){if(!AC)return;const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);gg.gain.setValueAtTime(v,AC.currentTime);gg.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(gg);gg.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}
function noise(d,v=0.2,ff=1200){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=ff;const gg=AC.createGain();gg.gain.value=v;s.connect(f);f.connect(gg);gg.connect(AC.destination);s.start();}
const sfx={coin:()=>{tone(988,0.08,'square',0.1);setTimeout(()=>tone(1319,0.15,'square',0.1),70)},boost:()=>{tone(200,0.6,'sawtooth',0.12,900);noise(0.5,0.25,2500)},box:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.1,'triangle',0.12),i*60))},
 spin:()=>tone(700,0.6,'triangle',0.15,150),bump:()=>noise(0.12,0.12,300),beep:(h)=>tone(h?880:440,h?0.6:0.3,'square',0.15),

// ---------- tracks ----------
const TRACKS=[
 {n:"Sunny Beach",sky:["#3fb4ff","#c9f3ff"],gr:["#f4dc8e","#ecd07a"],rd:["#8d8d8d","#868686"],rb:["#ffffff","#ff4a4a"],far:"#3a9de0",props:["palm","umbrella","palm","hut"],water:true,
  lay:[[60,0,0],[120,3,0],[80,0,15],[100,-2,-15],[140,4,0],[60,0,10],[120,-3,-10],[160,3,0],[80,0,0],[120,4,0]]},
 {n:"Forest",sky:["#6fc2ff","#e0f5ff"],gr:["#46a83c","#3f9a36"],rd:["#7a7a7a","#737373"],rb:["#ffffff","#2a6ce8"],far:"#2f7a3a",props:["pine","oak","mush","pine"],
  lay:[[60,0,0],[100,4,20],[100,-3,-20],[80,0,0],[140,5,0],[100,-4,25],[100,3,-25],[120,0,0],[140,4,0],[100,-2,0],[100,3,0]]},
 {n:"Candy Land",sky:["#ff9ad8","#ffe3f6"],gr:["#ffc1e3","#ffb3dc"],rd:["#b98ad8","#b183d0"],rb:["#ffffff","#ff3aa0"],far:"#ff70c0",props:["lolli","cane","cupcake","lolli"],
  lay:[[60,0,0],[120,-3,0],[80,3,15],[120,5,-15],[100,0,0],[120,-4,0],[140,4,20],[100,3,-20],[100,0,0],[120,3,0]]},
 {n:"Snowy Peaks",sky:["#8fd0ff","#f0faff"],gr:["#f7fbff","#e9f2fa"],rd:["#8a95a3","#838e9c"],rb:["#ffffff","#3a8de0"],far:"#b8d4ec",props:["spine","snowman","spine","igloo"],
  lay:[[60,0,0],[100,3,25],[120,-4,-10],[100,0,-15],[140,5,0],[100,-3,20],[120,3,-20],[80,0,0],[160,4,0],[100,-2,0]]}];
let T,segs,L,mapPts;
function build(ti){T=TRACKS[ti];segs=[];let y=0;
 const add=(curve,yy)=>{const n=segs.length;segs.push({i:n,curve,p1:{y:segs.length?segs[n-1].p2.y:0},p2:{y:yy},sprites:[],items:[],pad:null});};
 const road=(len,curve,hill)=>{const e=len/4|0,h=len/2|0,l=len-e-h,sy=y,ey=y+hill*SEG;let k=0,tot=e+h+l;
  for(let i=0;i<e;i++,k++)add(curve*Math.pow(i/e,2),lerp(sy,ey,(1-Math.cos(Math.PI*(k+1)/tot))/2));
  for(let i=0;i<h;i++,k++)add(curve,lerp(sy,ey,(1-Math.cos(Math.PI*(k+1)/tot))/2));
  for(let i=0;i<l;i++,k++)add(curve*(1-i/l),lerp(sy,ey,(1-Math.cos(Math.PI*(k+1)/tot))/2));y=ey;};
 T.lay.forEach(r=>road(r[0]*1.3|0,r[1],r[2]));if(y!==0)road(60,0,-y/SEG);road(40,0,0);
 L=segs.length*SEG;
 segs.forEach((s,i)=>{if(i%7==0)s.sprites.push({t:T.props[(i/7|0)%T.props.length],off:(i%14?-1:1)*rnd(1.4,2.6)});
  if(i%23==0)s.sprites.push({t:T.props[(i/23|0)%4],off:(i%46?1:-1)*rnd(1.3,2)});
  if(T.water&&i%9==3)s.sprites.push({t:'wave',off:-rnd(3,5)});
  if(i>30&&i%60==30){const o=[-0.55,0,0.55][(i/60|0)%3];for(let k=0;k<6;k++)segs[i+k*3]&&segs[i+k*3].items.push({t:'coin',off:o});}
  if(i>60&&i%150==75)[-0.55,0,0.55].forEach(o=>s.items.push({t:'box',off:o,cd:0}));
  if(i>40&&i%110==50)s.pad=[-0.45,0.45,0][(i/110|0)%3];});
 for(let i=0;i<6;i++){segs[i+3].start=true;}
 // minimap
 let tot=0;segs.forEach(s=>tot+=s.curve);const k=2*Math.PI/tot;let hd=0,px=0,py=0;mapPts=[];
 segs.forEach(s=>{hd+=s.curve*k;px+=Math.cos(hd);py+=Math.sin(hd);mapPts.push([px,py]);});
 const ex=mapPts[mapPts.length-1];mapPts=mapPts.map((p,i)=>[p[0]-ex[0]*i/mapPts.length,p[1]-ex[1]*i/mapPts.length]);
 let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;mapPts.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1]);});
 const sc=140/Math.max(mxx-mnx,mxy-mny);mapPts=mapPts.map(p=>[(p[0]-(mnx+mxx)/2)*sc,(p[1]-(mny+mxy)/2)*sc]);}
const seg=z=>segs[Math.floor(mod(z,L)/SEG)%segs.length];
// ---------- racers ----------
const NPC=[["Bunny","#ff8ad0"],["Froggy","#5ad04a"],["Tiger","#ff9a1a"],["Penguin","#4a5a7a"],["Bubbles","#5ad8ff"],["Ducky","#ffd820"],["Grape","#8a4ae8"],["Cherry","#d0203a"],["Minty","#3ae8b0"],["Coco","#9a6a3a"]];
let lastPl=0,popT=0,spI=0,bumpT=0,rockets=[],P,AI,state='title',btns=[],t0=0,cd=0,fin=[],msg='',msgT=0,ti=0,confetti=[],placeShown=0,skyOff=0,result=null;
function newRace(i){ti=i;build(i);const M=MODELS[S.model];
 P={dist:-SEG*2,x:0,speed:0,spin:0,boost:0,shield:0,item:null,coins:0,lap:0,steer:0,done:false,name:"You",max:BASEMAX*M.top,acc:M.acc,hand:M.hand,model:S.model,color:COLORS[S.color][1]};
 AI=NPC.map((n,k)=>{const row=Math.floor(k/2)+(k>=6?1:0);return{name:n[0],color:COLORS[Math.random()*COLORS.length|0][1],model:Math.random()*4|0,dist:-SEG*2+(5-row)*SEG*4-(k>=6?SEG*8:0),x:k%2?0.45:-0.45,tx:k%2?0.45:-0.45,speed:0,skill:rnd(0.74,0.88),spin:0,done:false,ft:0};});
 // player in the middle of the pack: row 3 of 6
 rockets=[];fin=[];confetti=[];setup3D();state='count';cd=3.99;t0=0;say("3");sfx.beep();lastCd=3;}
let lastCd=3;
// ---------- input ----------
const ptr=new Map();
function toLocal(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const p=toLocal(e);ptr.set(e.pointerId,p);
 if(state!=='race'&&state!=='count'||p[1]<90){for(const b of btns)if(p[0]>b.x&&p[0]<b.x+b.w&&p[1]>b.y&&p[1]<b.y+b.h){tone(660,0.08,'triangle',0.1);b.fn();break;}}
 if(state==='race'&&hit(p,RB.item))useItem();});
cv.addEventListener('pointermove',e=>{if(ptr.has(e.pointerId))ptr.set(e.pointerId,toLocal(e));});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,e=>ptr.delete(e.pointerId)));
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '&&state==='race')useItem();});addEventListener('keyup',e=>keys[e.key]=0);
const RB={l:{x:20,y:560,w:170,h:180},r:{x:205,y:560,w:170,h:180},up:{x:844,y:400,w:160,h:160},dn:{x:844,y:578,w:160,h:162},item:{x:680,y:610,w:140,h:130}};
const hit=(p,b)=>p[0]>b.x&&p[0]<b.x+b.w&&p[1]>b.y&&p[1]<b.y+b.h;
const held=b=>{for(const p of ptr.values())if(hit(p,b))return true;return false;};
const ITEMS=['zoom','nana','bubble','magnet','rocket'],ICON={zoom:'🚀',nana:'🍌',bubble:'🫧',magnet:'🧲',rocket:'🎯'},INAME={zoom:'Speed Boost',nana:'Banana',bubble:'Bubble Shield',magnet:'Coin Magnet',rocket:'Mini Rocket'};
function useItem(){if(!P.item||P.done)return;const it=P.item;P.item=null;
 if(it==='zoom'){P.boost=2.2;sfx.boost();flash("ZOOM!");}
 else if(it==='nana'){seg(P.dist-SEG*3).items.push({t:'nana',off:P.x});tone(300,0.2,'triangle');flash("Banana dropped!");}
 else if(it==='magnet'){P.magnet=8;tone(400,0.5,'sine',0.15,1200);flash("Coin magnet!");}
 else if(it==='rocket'){const ah=AI.filter(a=>a.dist>P.dist).sort((a,b)=>a.dist-b.dist)[0];if(ah){rockets.push({d:P.dist,x:P.x,tgt:ah});}tone(300,0.5,'sawtooth',0.12,900);flash("Mini rocket!");}
 else if(it==='bubble'){P.shield=8;tone(500,0.4,'sine',0.15,1000);flash("Bubble shield!");}}
function flash(m){msg=m;msgT=1.4;}
// ---------- update ----------
function ord(n){return n+(n==1?"st":n==2?"nd":n==3?"rd":"th");}
function place(){if(P.done)return P.place;return 1+AI.filter(a=>a.dist>P.dist).length;}
function update(dt){
 if(state==='count'){cd-=dt;const c=Math.ceil(cd);if(c!==lastCd&&c>0){lastCd=c;say(""+c);sfx.beep();}
  if(cd<=0){state='race';say("GO!");sfx.beep(1);flash("GO!");}}
 if(state!=='race'&&state!=='finish'&&state!=='spectate'){if(engG)engG.gain.value=0;return;}
 const racing=state==='race'||state==='finish';
 // player
 const ps=seg(P.dist),pct=Math.abs(P.speed)/P.max;
 let st=0;if(!P.done){if(held(RB.l)||keys.ArrowLeft)st-=1;if(held(RB.r)||keys.ArrowRight)st+=1;}
 P.steer=lerp(P.steer,st,dt*8);
 const gas=P.done||held(RB.up)||keys.ArrowUp,braking=!P.done&&!gas&&(held(RB.dn)||keys.ArrowDown);
 let mx=P.max*(P.boost>0?1.45:1);if(Math.abs(P.x)>1.05&&P.boost<=0)mx*=0.55;
 if(P.done)mx=P.max*0.5;
 if(P.spin>0){P.spin-=dt;P.speed*=Math.pow(0.4,dt);}
 else if(braking)P.speed-=(P.speed>0?P.max*1.5:P.max*0.15)*dt;
 else if(gas)P.speed+=(P.speed<0?P.max*1.5:P.speed<mx?P.max*0.45*P.acc:-P.max*0.8)*dt;
 else P.speed-=Math.sign(P.speed)*Math.min(Math.abs(P.speed),P.max*0.35*dt);
 P.speed=clamp(P.speed,-P.max*0.22,P.max*1.5);
 if(P.boost>0)P.boost-=dt;if(P.magnet>0)P.magnet-=dt;if(P.shield>0)P.shield-=dt;
 if(P.spin<=0)P.x+=P.steer*dt*2.2*Math.min(1,pct+0.3)*P.hand;
 P.x-=dt*2*pct*pct*ps.curve*0.18;P.x=clamp(P.x,-2.3,2.3);
 const od=P.dist;P.dist+=P.speed*dt;skyOff+=ps.curve*pct*dt*0.01;
 // items near player
 for(const s of (P.magnet>0?[ps,seg(P.dist+SEG),seg(P.dist+2*SEG),seg(P.dist+3*SEG)]:[ps,seg(P.dist+SEG)])){
  if(s.pad!==null&&Math.abs(P.x-s.pad)<0.3&&P.boost<1){P.boost=1.6;sfx.boost();flash("BOOST!");}
  for(const it of s.items){const d=Math.abs(P.x-it.off);
   if(it.t==='coin'&&!it.got&&d<(P.magnet>0?2:0.28)){it.got=1;P.coins++;sfx.coin();}
   if(it.t==='box'&&it.cd<=0&&d<0.3){it.cd=4;if(!P.item){P.item=ITEMS[Math.random()*ITEMS.length|0];sfx.box();}}
   if(it.t==='nana'&&!it.gone&&d<0.25){it.gone=1;if(P.shield>0){P.shield=0;flash("Bubble saved you!");}else if(MODELS[P.model].n==="Bumper"){flash("Bumper is too grippy!");}else{P.spin=1.0;sfx.spin();flash("Wheee!");}}}}
 segs.forEach(s=>s.items.forEach(it=>{if(it.cd>0)it.cd-=dt;}));
 // lap
 const lap=Math.floor(P.dist/L);if(lap>P.lap&&!P.done){P.lap=lap;
  if(lap>=LAPS){P.done=true;P.place=1+fin.length;fin.push(P);state='finish';t0=0;P.item=null;sfx.cheer();
   say(P.place==1?"You got 1st place! You win!":"You got "+ord(P.place)+" place! Great racing!");flash(ord(P.place)+" PLACE!");}
  else{flash(lap==LAPS-1?"FINAL LAP!":"LAP "+(lap+1));say(lap==LAPS-1?"Final lap!":"Lap "+(lap+1));tone(784,0.3,'triangle');}}
 // AI
 for(const a of AI){const as=seg(a.dist);let tgt=BASEMAX*a.skill;const gap=a.dist-P.dist;
  if(!a.done&&!P.done){if(gap>SEG*12)tgt*=0.82;else if(gap>SEG*4)tgt*=0.93;if(gap<-SEG*25)tgt*=1.12;}else tgt*=0.5;
  if(a.boost>0)tgt*=1.35;if(a.spin>0){a.spin-=dt;a.speed*=Math.pow(0.4,dt);}else a.speed+=clamp(tgt-a.speed,-BASEMAX*0.8*dt,BASEMAX*0.4*dt);
  a.itemCd=(a.itemCd||0)-dt;a.seek=null;
  if(!a.item&&a.itemCd<=0&&!a.done){for(let n=1;n<18&&!a.seek;n++){for(const it of seg(a.dist+n*SEG).items)if(it.t==='box'&&!(it.cd>0)){if(!a.seek||Math.abs(it.off-a.x)<Math.abs(a.seek.off-a.x))a.seek=it;}}}
  if(a.seek)a.tx=a.seek.off;else if(Math.random()<dt*0.3)a.tx=[-0.6,-0.2,0.2,0.6][Math.random()*4|0];
  if(Math.abs(gap)<SEG*2&&Math.abs(a.x-P.x)<0.35)a.tx=a.x>P.x?Math.min(0.8,P.x+0.5):Math.max(-0.8,P.x-0.5);
  a.x=lerp(a.x,a.tx,dt*1.5);
  a.dist+=a.speed*dt;
  for(const it of as.items)if(it.t==='nana'&&!it.gone&&Math.abs(a.x-it.off)<0.25){it.gone=1;if(a.bubble>0)a.bubble=0;else a.spin=1;}
  for(const it of as.items)if(it.t==='box'&&!(it.cd>0)&&!a.item&&a.itemCd<=0&&Math.abs(a.x-it.off)<0.32){it.cd=4;a.item=['zoom','zoom','nana','bubble','rocket'][Math.random()*5|0];a.useT=rnd(2,5);}
  if(a.item){a.useT-=dt;if(a.useT<=0){const it=a.item;let used=true;
   if(it==='zoom')a.boost=1.3;
   else if(it==='nana'){if(gap>SEG*6||gap<-SEG*3)seg(a.dist-SEG*2).items.push({t:'nana',off:a.x});else{used=false;a.useT=1;}}
   else if(it==='bubble')a.bubble=8;
   else if(it==='rocket'){const ah=[P,...AI].filter(k=>k!==a&&!k.done&&k.dist>a.dist&&k.dist-a.dist<SEG*30).sort((x,y)=>x.dist-y.dist)[0];if(ah)rockets.push({d:a.dist,x:a.x,tgt:ah,src:a});else{used=false;a.useT=1.5;}}
   if(used){a.item=null;a.itemCd=rnd(10,16);a.showIcon=it;a.showT=1.2;}}}
  if(a.showT>0)a.showT-=dt;if(a.boost>0)a.boost-=dt;
  if(a.bubble>0)a.bubble-=dt;
  // bump with player
  if(Math.abs(a.dist-P.dist)<SEG*0.8&&Math.abs(a.x-P.x)<0.3){const d=P.x>a.x?1:-1;P.x+=d*0.12;a.x-=d*0.12;a.tx=a.x;if(!(bumpT>0)){bumpT=0.4;sfx.bump();}}
  for(const b of AI)if(b!==a&&Math.abs(a.dist-b.dist)<SEG*0.8&&Math.abs(a.x-b.x)<0.3){const d=a.x>b.x?1:-1;a.x+=d*dt*1.5;b.x-=d*dt*1.5;}
  if(!a.done&&a.dist>=LAPS*L){a.done=true;fin.push(a);if(state==='spectate'){t0=0;}}}
 for(const r of rockets){r.d+=BASEMAX*1.8*dt;r.x=lerp(r.x,r.tgt.x,dt*4);if(r.d>=r.tgt.dist){r.done=1;const k=r.tgt;if(k===P){if(P.shield>0){P.shield=0;flash("Bubble saved you!");}else if(MODELS[P.model].n==="Bumper")flash("Bumper is too grippy!");else{P.spin=0.7;sfx.spin();flash("Bonk! Wheee!");}}
  else if(k.bubble>0){k.bubble=0;}else{k.spin=0.9;if(!r.src){sfx.spin();flash("Bonk! "+k.name+" spins!");}}}}
 rockets=rockets.filter(r=>!r.done);
 if(state==='finish'){t0+=dt;if(t0>3){if(AI.every(a=>a.done))endRace();else{state='spectate';spI=AI.findIndex(a=>!a.done);say("Let's watch the others finish!");}}}
 if(state==='spectate'&&AI.every(a=>a.done)){t0+=dt;if(t0>5.5)endRace();}
